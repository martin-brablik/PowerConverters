buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
		
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = "1.7.10-2.11"
group= "covers1624.powerconverters"
archivesBaseName = "PowerConverters"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

// The original s3.amazonaws.com Minecraft download URLs are dead; use Mojang's launcher CDN.
afterEvaluate {
    tasks.downloadClient.setUrl(new net.minecraftforge.gradle.delayed.DelayedString(project, "https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar"))
    tasks.downloadServer.setUrl(new net.minecraftforge.gradle.delayed.DelayedString(project, "https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar"))
}

String buildNo = "unknown"
if(System.getenv("BUILD_NUMBER") != null){
	buildNo = System.getenv("BUILD_NUMBER")
	version = version + "-${buildNo}"
}


repositories {
	// CurseForge mirror (the old cursecdn / Mobius / Covers1624 repos are dead)
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
	}
	// All the CB stuff, Core, NEI, FMP and lib are on the forge maven.
	maven {
		name = "CB Repo"
		url = "http://chickenbones.net/maven/"
	}
	// IC2
	maven {
		name = "ic2"
		url = "http://maven.ic2.player.to/"
	}
	// Buildcraft
    ivy {
        name "BuildCraft"
        artifactPattern "http://www.mod-buildcraft.com/releases/BuildCraft/[revision]/[module]-[revision]-[classifier].[ext]"
    }
	// PneumaticCraft
	maven {
        name = "MM repo"
        url = "http://maven.k-4u.nl/"
    }
}

dependencies {

	compile "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev" //CCL
	compile "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev" //CCC
	compile "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev" //NEI
	compile "curse.maven:waila-73488:2230518" // Waila 1.5.10
	compile name: "buildcraft", version: "7.1.14", classifier: "dev"// Buildcraft
	compile 'net.industrial-craft:industrialcraft-2:2.2.822-experimental:dev' //IC2
	compile "pneumaticCraft:PneumaticCraft-1.7.10:1.9.10-98:userdev" //PneumaticCraft
	
	//COFH Stuff
    compile 'curse.maven:cofh-core-69162:2277479'
    compile 'curse.maven:redstone-arsenal-70631:2277491'
    compile 'curse.maven:thermal-expansion-69163:2277517'
    compile 'curse.maven:thermal-foundation-222880:2277481'
    compile 'curse.maven:thermal-dynamics-227443:2246951'
	compile 'curse.maven:railcraft-51195:2263415'
	
}

jar {
    manifest {
        attributes 'FMLCorePlugin': 'covers1624.powerconverters.asm.ASMHandler'
		attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}

task deobfJar(type: Jar, dependsOn: 'jar') {
	from sourceSets.main.output
	classifier "dev"
}

build.dependsOn deobfJar

artifacts {
	archives deobfJar
}

processResources{
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
